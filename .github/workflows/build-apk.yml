name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK packages
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Cache offline speech assets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            app/libs/*.aar
            app/src/main/assets/rapidocr/*.onnx
            app/src/main/assets/rapidocr/keys-*.txt
            app/src/main/assets/asr-en/*.onnx
            app/src/main/assets/asr-en/tokens.txt
            app/src/main/assets/asr-en/bpe.vocab
            app/src/main/assets/asr-zh/*.onnx
            app/src/main/assets/asr-zh/tokens.txt
          key: speech-assets-${{ hashFiles('app/build.gradle.kts') }}

      # Android signs the debug APK automatically; release signing secrets are not needed.
      - name: Build installable debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Package APK and checksum
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/欧了提词器.apk
          python3 - <<'PY'
          from zipfile import ZipFile
          with ZipFile('dist/欧了提词器.apk') as apk:
              languages = {name.split('/')[1] for name in apk.namelist() if name.startswith('assets/asr-')}
              assert languages == {'asr-zh', 'asr-en'}, languages
              for model in ('det.onnx', 'cls.onnx', 'rec-zh.onnx', 'rec-en.onnx'):
                  assert apk.getinfo(f'assets/rapidocr/{model}').file_size > 100_000, model
              for language in ('zh', 'en'):
                  assert apk.read(f'assets/rapidocr/keys-{language}.txt').decode('utf-8').strip()
              assert 'lib/arm64-v8a/libonnxruntime4j_jni.so' in apk.namelist()
              assert 'lib/arm64-v8a/libopencv_java4.so' in apk.namelist()
              assert not any('tesseract' in name or name.startswith('assets/ocr/') for name in apk.namelist())
          PY
          (cd dist && sha256sum 欧了提词器.apk > SHA256SUMS.txt)

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 欧了提词器-APK-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
